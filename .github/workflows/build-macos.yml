name: macOS Build

# Build tilde for macOS and produce a downloadable binary artifact.
# On tagged releases (v*) the binary is also attached to the GitHub Release.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.arch_label }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # needed to upload assets to GitHub Releases

    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (arm64) – default "latest" macOS runner
          - os: macos-latest
            arch_label: arm64
          # Intel (x86_64)
          - os: macos-14
            arch_label: x86_64

    steps:
      # ── 1. Checkout tilde into the default workspace ────────────────────────
      - name: Checkout tilde
        uses: actions/checkout@v4
        with:
          # Full history is needed so `git describe` can find tags for the
          # version string embedded in the packaged binary name.
          fetch-depth: 0

      # ── 2. LLnextgen ────────────────────────────────────────────────────────
      # LLnextgen is a parser-generator required by the t3key library.
      # It is not available via Homebrew, so we build it from source.
      - name: Cache LLnextgen build
        id: cache-llnextgen
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llnextgen-install
          key: llnextgen-0.5.5-${{ matrix.arch_label }}

      - name: Build and install LLnextgen
        if: steps.cache-llnextgen.outputs.cache-hit != 'true'
        run: |
          LLNEXTGEN_VERSION=0.5.5
          INSTALL_DIR="$RUNNER_TEMP/llnextgen-install"
          curl -fsSL \
            "https://os.ghalkes.nl/LLnextgen/releases/LLnextgen-${LLNEXTGEN_VERSION}.tgz" \
            -o llnextgen.tgz
          tar xzf llnextgen.tgz
          cd "LLnextgen-${LLNEXTGEN_VERSION}"
          ./configure --prefix="${INSTALL_DIR}"
          make
          make install

      - name: Add LLnextgen to PATH
        run: echo "$RUNNER_TEMP/llnextgen-install/bin" >> "$GITHUB_PATH"

      # ── 3. Build everything using automation script ──────────────────────────
      - name: Build Tilde with automation script
        run: |
          chmod +x ./mac_build.sh
          ./mac_build.sh

      # ── 4. Smoke-test the binary ─────────────────────────────────────────────
      - name: Verify binary runs
        run: |
          export DYLD_LIBRARY_PATH="${PWD}/../transcript/src/.libs:${PWD}/../t3config/src/.libs:${PWD}/../t3key/src/.libs:${PWD}/../t3window/src/.libs:${PWD}/../t3widget/src/.libs:${PWD}/../t3highlight/src/.libs:$DYLD_LIBRARY_PATH"
          file src/.objects/edit
          # --version / --help should exit cleanly (exit 0 or 1 are both fine
          # for a terminal editor; we just want to confirm it executes)
          src/.objects/edit --version 2>&1 || true

      # ── 9. Package the binary ────────────────────────────────────────────────
      - name: Package binary
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          ARCH=$(uname -m)
          PKG="tilde-${VERSION}-macos-${ARCH}"
          mkdir -p "${PKG}/libs"
          mkdir -p "${PKG}/data/transcript"
          mkdir -p "${PKG}/data/t3key"

          # 1. Binary and Launcher
          cp src/.objects/edit "${PKG}/tilde.real"
          cat > "${PKG}/tilde" <<'EOF'
          #!/bin/bash
          DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
          export TILDE_DATADIR="$DIR/data"
          export T3KEY_DATABASE_PATH="$DIR/data/t3key"
          export TRANSCRIPT_PATH="$DIR/data/transcript"
          # Set DYLD_LIBRARY_PATH to ensure our bundled libs are found
          export DYLD_LIBRARY_PATH="$DIR/libs:$DYLD_LIBRARY_PATH"
          exec "$DIR/tilde.real" "$@"
          EOF
          chmod +x "${PKG}/tilde"

          # 2. Bundle companion libraries
          LIBS="libtranscript libt3config libt3key libt3window libt3widget libt3highlight"
          for lib in $LIBS; do
            cp ../*/src/.libs/${lib}.0.dylib "${PKG}/libs/"
          done

          # 3. Bundle shared dependencies from Homebrew
          BREW=$(brew --prefix)
          cp "${BREW}/opt/libunistring/lib/libunistring.5.dylib" "${PKG}/libs/"
          cp "${BREW}/opt/pcre2/lib/libpcre2-8.0.dylib" "${PKG}/libs/"

          # 4. Bundle Data Files
          cp src/base.config "${PKG}/data/"
          # Copy ALL ltc files into a FLAT directory (both modules/ and tables/ subdirs)
          find ../transcript/src/modules/.libs -name "*.ltc" -exec cp {} "${PKG}/data/transcript/" \;
          find ../transcript/src/tables/.libs  -name "*.ltc" -exec cp {} "${PKG}/data/transcript/" \;
          cp ../t3key/src/database/* "${PKG}/data/t3key/"

          # Ensure everything is writable for install_name_tool
          chmod -R 755 "${PKG}"

          # 5. Fix Linkage (Targeting tilde.real)
          for libName in libtranscript.0.dylib libt3config.0.dylib libt3key.0.dylib libt3window.0.dylib libt3widget.0.dylib libt3highlight.0.dylib; do
             install_name_tool -change "/usr/lib/${libName}" "@executable_path/libs/${libName}" "${PKG}/tilde.real"
          done
          
          for targetLib in "${PKG}/libs/"*.dylib; do
            for neighbor in libtranscript.0.dylib libt3config.0.dylib libt3key.0.dylib libt3window.0.dylib libt3widget.0.dylib libt3highlight.0.dylib; do
              install_name_tool -change "/usr/lib/${neighbor}" "@loader_path/${neighbor}" "${targetLib}"
            done
            install_name_tool -change "${BREW}/opt/libunistring/lib/libunistring.5.dylib" "@loader_path/libunistring.5.dylib" "${targetLib}"
            install_name_tool -change "${BREW}/opt/pcre2/lib/libpcre2-8.0.dylib" "@loader_path/libpcre2-8.0.dylib" "${targetLib}"
            libBase=$(basename "$targetLib")
            install_name_tool -id "@loader_path/${libBase}" "${targetLib}"
          done

          # Fix Linkage for ALL transcript ltc bundles - they are now in data/transcript/ (flat)
          # @loader_path for a .ltc in data/transcript/ points: data/transcript/../../libs/ = libs/
          for ltcFile in "${PKG}/data/transcript/"*.ltc; do
            install_name_tool -change "/usr/lib/libtranscript.0.dylib" "@loader_path/../../libs/libtranscript.0.dylib" "${ltcFile}"
          done

          install_name_tool -change "${BREW}/opt/libunistring/lib/libunistring.5.dylib" "@executable_path/libs/libunistring.5.dylib" "${PKG}/tilde.real"
          install_name_tool -change "${BREW}/opt/pcre2/lib/libpcre2-8.0.dylib" "@executable_path/libs/libpcre2-8.0.dylib" "${PKG}/tilde.real"

          # 6. Ad-hoc sign everything
          echo "--> Applying ad-hoc signatures..."
          codesign -s - -f "${PKG}/libs/"*.dylib
          codesign -s - -f "${PKG}/data/transcript/"*.ltc
          codesign -s - -f "${PKG}/tilde.real"

          # 7. Generate Documentation
          cat > "${PKG}/INSTALL.md" <<'MDEOF'
          # Tilde – macOS Standalone Binary
          
          ## Running Tilde
          1. Extract the tarball.
          2. Run `./tilde` from the terminal.
          
          This launcher script automatically configures the environment to use the bundled
          libraries and data files.
          
          **Note on Gatekeeper:** If macOS blocks execution, run:
          ```bash
          xattr -d com.apple.quarantine tilde tilde.real libs/*.dylib
          ```
          
          ## Support
          This build supports both Intel and Apple Silicon (depending on which package you downloaded).
          MDEOF

          tar -czf "${PKG}.tar.gz" "${PKG}/"
          echo "PKG=${PKG}.tar.gz" >> "$GITHUB_ENV"

      # ── 10. Upload artifact (available from every CI run) ───────────────────
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tilde-macos-${{ matrix.arch_label }}
          path: tilde-*-macos-*.tar.gz
          if-no-files-found: error

      # ── 11. Attach to GitHub Release (only on version tags) ─────────────────
      - name: Attach binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tilde-*-macos-*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
