name: macOS Build

# Build tilde for macOS and produce a downloadable binary artifact.
# On tagged releases (v*) the binary is also attached to the GitHub Release.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.arch_label }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # needed to upload assets to GitHub Releases

    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (arm64) – default "latest" macOS runner
          - os: macos-latest
            arch_label: arm64
          # Intel (x86_64)
          - os: macos-14
            arch_label: x86_64

    steps:
      # ── 1. Checkout tilde into the default workspace ────────────────────────
      - name: Checkout tilde
        uses: actions/checkout@v4
        with:
          # Full history is needed so `git describe` can find tags for the
          # version string embedded in the packaged binary name.
          fetch-depth: 0

      # ── 2. LLnextgen ────────────────────────────────────────────────────────
      # LLnextgen is a parser-generator required by the t3key library.
      # It is not available via Homebrew, so we build it from source.
      - name: Cache LLnextgen build
        id: cache-llnextgen
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llnextgen-install
          key: llnextgen-0.5.5-${{ matrix.arch_label }}

      - name: Build and install LLnextgen
        if: steps.cache-llnextgen.outputs.cache-hit != 'true'
        run: |
          LLNEXTGEN_VERSION=0.5.5
          INSTALL_DIR="$RUNNER_TEMP/llnextgen-install"
          curl -fsSL \
            "https://os.ghalkes.nl/LLnextgen/releases/LLnextgen-${LLNEXTGEN_VERSION}.tgz" \
            -o llnextgen.tgz
          tar xzf llnextgen.tgz
          cd "LLnextgen-${LLNEXTGEN_VERSION}"
          ./configure --prefix="${INSTALL_DIR}"
          make
          make install

      - name: Add LLnextgen to PATH
        run: echo "$RUNNER_TEMP/llnextgen-install/bin" >> "$GITHUB_PATH"

      # ── 3. Build everything using automation script ──────────────────────────
      - name: Build Tilde with automation script
        run: |
          chmod +x ./mac_build.sh
          ./mac_build.sh

      # ── 4. Smoke-test the binary ─────────────────────────────────────────────
      - name: Verify binary runs
        run: |
          export DYLD_LIBRARY_PATH="${PWD}/../transcript/src/.libs:${PWD}/../t3config/src/.libs:${PWD}/../t3key/src/.libs:${PWD}/../t3window/src/.libs:${PWD}/../t3widget/src/.libs:${PWD}/../t3highlight/src/.libs:$DYLD_LIBRARY_PATH"
          file src/.objects/edit
          # --version / --help should exit cleanly (exit 0 or 1 are both fine
          # for a terminal editor; we just want to confirm it executes)
          src/.objects/edit --version 2>&1 || true

      # ── 9. Package the binary ────────────────────────────────────────────────
      - name: Package binary
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          ARCH=$(uname -m)
          PKG="tilde-${VERSION}-macos-${ARCH}"
          mkdir -p "${PKG}"

          cp src/.objects/edit "${PKG}/tilde"

          cat > "${PKG}/INSTALL.md" <<'MDEOF'
          # Tilde – macOS Binary

          ## Runtime requirements

          Install the following via [Homebrew](https://brew.sh):

          ```
          brew install ncurses libunistring pcre2
          ```

          ## Running Tilde

          ```
          ./tilde [file ...]
          ```

          Key bindings (Ctrl = Control, Alt = Meta/Option):
          - **Alt-F**  File menu
          - **Ctrl-S** Save
          - **Ctrl-O** Open file
          - **Ctrl-Q** Quit
          - **Ctrl-C / Ctrl-V** Copy / Paste
          - **Ctrl-Z / Ctrl-Y** Undo / Redo
          - **Ctrl-F** Find
          MDEOF

          tar -czf "${PKG}.tar.gz" "${PKG}/"
          echo "PKG=${PKG}.tar.gz" >> "$GITHUB_ENV"

      # ── 10. Upload artifact (available from every CI run) ───────────────────
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tilde-macos-${{ matrix.arch_label }}
          path: tilde-*-macos-*.tar.gz
          if-no-files-found: error
          # Keep artifacts for 90 days (GitHub default)

      # ── 11. Attach to GitHub Release (only on version tags) ─────────────────
      - name: Attach binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tilde-*-macos-*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
